<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Graphic Designer &amp; Video Editor | Kre8withseven Creative Portfolio</title>
    <meta
      name="description"
      content="Explore Kre8withseven's creative portfolio — graphic design, brand assets, campaign graphics, social media creatives, and video editing projects."
    />
    <meta name="author" content="Kre8withseven" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://kre8withseven.com/" />
    <meta property="og:title"       content="Graphic Designer &amp; Video Editor | Kre8withseven" />
    <meta
      property="og:description"
      content="Explore a creative portfolio showcasing graphic design, brand assets, campaign graphics, social media creatives, and video editing projects."
    />
    <!-- Replace with your actual OG image once you have one -->
    <!-- <meta property="og:image" content="https://kre8withseven.com/og-image.jpg" /> -->

    <!-- Twitter / X Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Graphic Designer &amp; Video Editor | Kre8withseven" />
    <meta
      name="twitter:description"
      content="Explore a creative portfolio showcasing graphic design, brand assets, campaign graphics, social media creatives, and video editing projects."
    />
    <!-- <meta name="twitter:image" content="https://kre8withseven.com/og-image.jpg" /> -->

    <!-- Theme colour (browser UI accent on mobile) -->
    <meta name="theme-color" content="#050309" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect for Google Fonts (loaded in CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <!-- Skip-to-content for keyboard / screen-reader users -->
    <a
      href="#main-content"
      style="
        position:absolute;left:-9999px;top:0;
        background:var(--accent,#8B5CF6);color:#fff;
        padding:.5rem 1rem;z-index:9999;border-radius:0 0 8px 0;
        font-family:system-ui,sans-serif;font-size:.875rem;
      "
      onfocus="this.style.left='0'"
      onblur="this.style.left='-9999px'"
    >
      Skip to main content
    </a>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
